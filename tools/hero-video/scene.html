<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      #stage { position: relative; width: 1280px; height: 720px; }
      canvas { display: block; }
      #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
      #flash { position: absolute; inset: 0; background: #fff3e0; opacity: 0; pointer-events: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="stage"><canvas id="c" width="1280" height="720"></canvas><div id="fade"></div><div id="flash"></div></div>
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const W = 1280, H = 720, DURATION = 24;
      let seed = 7;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
      const rr = (a, b) => a + rnd() * (b - a);

      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060a);
      scene.fog = new THREE.FogExp2(0x090b12, 0.0036);
      const camera = new THREE.PerspectiveCamera(58, W / H, 0.2, 1200);

      // ---------- glow sprite texture
      const glowTexRef = (() => { let t = null; return () => { if (t) return t; const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32); grd.addColorStop(0, "rgba(255,220,170,1)"); grd.addColorStop(0.25, "rgba(255,190,120,0.6)"); grd.addColorStop(1, "rgba(255,170,90,0)"); g.fillStyle = grd; g.fillRect(0, 0, 64, 64); t = new THREE.CanvasTexture(c); return t; }; })();
      // ---------- materials
      const matDark = new THREE.MeshStandardMaterial({ color: 0x363b46, roughness: 0.75, metalness: 0.1 });
      const matWindowWarm = new THREE.MeshBasicMaterial({ color: 0xffb36b });
      const matWindowCool = new THREE.MeshBasicMaterial({ color: 0xbcd0ff });
      const matStreet = new THREE.MeshStandardMaterial({ color: 0x1d1f26, roughness: 0.4, metalness: 0.1 });

      // ---------- ground and streets
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshStandardMaterial({ color: 0x111319, roughness: 0.9 }));
      ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);

      const BLOCK = 30, STREET = 8, N = 15;
      const inFactory = (x, z) => x > -20 && x < 96 && z > 30 && z < 140;
      const streets = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), matStreet, N * 2 * 2 + 4);
      let si = 0; const m4 = new THREE.Matrix4(); const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
      for (let i = -N; i <= N; i++) {
        const c = i * (BLOCK + STREET);
        m4.compose(new THREE.Vector3(c, 0, 0), q, new THREE.Vector3(STREET, 1600, 1)); streets.setMatrixAt(si++, m4);
        m4.compose(new THREE.Vector3(0, 0, c), q, new THREE.Vector3(1600, STREET, 1)); streets.setMatrixAt(si++, m4);
      }
      streets.count = si; scene.add(streets);

      // ---------- buildings + windows (instanced)
      const bMatrices = [], winWarm = [], winCool = [];
      const addBuilding = (x, z, w, d, h) => {
        bMatrices.push(new THREE.Matrix4().compose(new THREE.Vector3(x, h / 2, z), new THREE.Quaternion(), new THREE.Vector3(w, h, d)));
        const rows = Math.floor(h / 3.2), lit = rr(0.25, 0.6);
        for (let f = 0; f < 4; f++) {
          const along = f < 2 ? w : d, cols = Math.max(1, Math.floor(along / 2.6));
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            if (rnd() > lit) continue;
            const u = -along / 2 + 1.3 + c * 2.6, y = 1.8 + r * 3.2;
            let px, pz, ry;
            if (f === 0) { px = x + u; pz = z + d / 2 + 0.02; ry = 0; }
            else if (f === 1) { px = x + u; pz = z - d / 2 - 0.02; ry = Math.PI; }
            else if (f === 2) { px = x + w / 2 + 0.02; pz = z + u; ry = Math.PI / 2; }
            else { px = x - w / 2 - 0.02; pz = z + u; ry = -Math.PI / 2; }
            const mm = new THREE.Matrix4().compose(new THREE.Vector3(px, y, pz), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, 0)), new THREE.Vector3(1.3, 1.6, 1));
            (rnd() < 0.82 ? winWarm : winCool).push(mm);
          }
        }
      };
      for (let gx = -N; gx < N; gx++) for (let gz = -N; gz < N; gz++) {
        const cx = gx * (BLOCK + STREET) + BLOCK / 2 + STREET / 2, cz = gz * (BLOCK + STREET) + BLOCK / 2 + STREET / 2;
        if (inFactory(cx, cz)) continue;
        const dist = Math.hypot(cx - 80, cz + 220);
        const downtown = dist < 120;
        const n = downtown ? 1 + Math.floor(rnd() * 2) : 1 + Math.floor(rnd() * 3);
        for (let k = 0; k < n; k++) {
          const w = rr(8, 14), d = rr(8, 14);
          const h = downtown ? rr(40, 110) * (1 - dist / 160) + 20 : rr(5, 22);
          addBuilding(cx + rr(-BLOCK / 2 + w / 2, BLOCK / 2 - w / 2), cz + rr(-BLOCK / 2 + d / 2, BLOCK / 2 - d / 2), w, d, h);
        }
      }
      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      const beaconPos = [];
      bMatrices.forEach((m) => { const e = m.elements; if (e[5] > 50) beaconPos.push(e[12], e[5] + 0.6, e[14]); });
      const beaconGeo = new THREE.BufferGeometry(); beaconGeo.setAttribute("position", new THREE.Float32BufferAttribute(beaconPos, 3));
      scene.add(new THREE.Points(beaconGeo, new THREE.PointsMaterial({ map: glowTexRef(), size: 4, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xff3b2f })));
      const buildings = new THREE.InstancedMesh(boxGeo, matDark, bMatrices.length);
      bMatrices.forEach((m, i) => buildings.setMatrixAt(i, m)); scene.add(buildings);
      const winGeo = new THREE.PlaneGeometry(1, 1);
      const mkWin = (arr, mat) => { const im = new THREE.InstancedMesh(winGeo, mat, arr.length); arr.forEach((m, i) => im.setMatrixAt(i, m)); scene.add(im); };
      mkWin(winWarm, matWindowWarm); mkWin(winCool, matWindowCool);

      // ---------- street lamps as glowing points
      const glowTex = glowTexRef();
      const lampPos = [];
      for (let i = -N; i <= N; i++) for (let j = -N * 4; j <= N * 4; j++) {
        const c = i * (BLOCK + STREET), s = j * 9.5;
        if (!inFactory(c, s)) lampPos.push(c + STREET / 2 - 0.5, 4.5, s);
        if (!inFactory(s, c)) lampPos.push(s, 4.5, c + STREET / 2 - 0.5);
      }
      const lampGeo = new THREE.BufferGeometry(); lampGeo.setAttribute("position", new THREE.Float32BufferAttribute(lampPos, 3));
      scene.add(new THREE.Points(lampGeo, new THREE.PointsMaterial({ map: glowTex, size: 5, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffc58a, sizeAttenuation: true })));

      // ---------- alley
      const brick = new THREE.MeshStandardMaterial({ color: 0x2a201c, roughness: 0.95 });
      const leftWall = new THREE.Mesh(boxGeo, brick); leftWall.position.set(-9, 6.5, 70); leftWall.scale.set(14, 13, 60); scene.add(leftWall);
      const alleyFloor = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 60), new THREE.MeshStandardMaterial({ color: 0x101114, roughness: 0.25, metalness: 0.2 }));
      alleyFloor.rotation.x = -Math.PI / 2; alleyFloor.position.set(0, 0.01, 70); scene.add(alleyFloor);
      const pipeMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3c, roughness: 0.6, metalness: 0.5 });
      for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 12, 8), pipeMat); p.position.set(i % 2 ? -2.05 : 2.05, 6, 44 + i * 9.3); scene.add(p); }
      const bin = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0x1f3a2a, roughness: 0.8 })); bin.position.set(-1.2, 0.7, 58); bin.scale.set(1.4, 1.4, 2.2); scene.add(bin);
      for (let i = 0; i < 4; i++) { const l = new THREE.PointLight(0xffb070, 18, 22, 2); l.position.set(i % 2 ? -1.8 : 1.8, 4.2, 48 + i * 13); scene.add(l); }
      // door on the right wall
      const doorGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.7), new THREE.MeshBasicMaterial({ color: 0xffe2b8 }));
      doorGlow.position.set(1.97, 1.35, 96); doorGlow.rotation.y = -Math.PI / 2; scene.add(doorGlow);
      const doorFrame = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0x0c0c0e })); doorFrame.position.set(1.98, 1.5, 96); doorFrame.scale.set(0.1, 3.1, 1.9); scene.add(doorFrame);
      const doorLamp = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0xfff0d0 })); doorLamp.position.set(1.9, 3.4, 96); doorLamp.scale.set(0.2, 0.2, 0.9); scene.add(doorLamp);
      const doorSpot = new THREE.PointLight(0xffe6c0, 40, 14, 2); doorSpot.position.set(1.4, 3.6, 96); scene.add(doorSpot);
      const doorLight = new THREE.PointLight(0xffd9a8, 30, 18, 2); doorLight.position.set(1.2, 2.2, 96); scene.add(doorLight);

      // ---------- factory hall (camera enters it)
      const cler = new THREE.MeshBasicMaterial({ color: 0xffd39a });
      for (let i = 0; i < 12; i++) { for (const [x, z, ry] of [[1.96, 62 + i * 5.8, -Math.PI / 2], [41 - 36 + i * 6.2, 59.96, Math.PI], [41 - 36 + i * 6.2, 130.04, 0]]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.6), cler); w.position.set(x, 14.5, z); w.rotation.y = ry; scene.add(w); } }
      for (let i = 0; i < 4; i++) { const l = new THREE.PointLight(0xffc98a, 70, 40, 2); l.position.set(-1 + i * 0, 16, 62 + i * 18); scene.add(l); }
      const hall = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0x2a2d34, roughness: 0.9, side: THREE.DoubleSide }));
      hall.position.set(41, 9, 95); hall.scale.set(78, 18, 70); scene.add(hall);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(77, 69), new THREE.MeshStandardMaterial({ color: 0x1b1c20, roughness: 0.32, metalness: 0.15 }));
      floor.rotation.x = -Math.PI / 2; floor.position.set(41, 0.02, 95); scene.add(floor);
      const steel = new THREE.MeshStandardMaterial({ color: 0x3b3d42, roughness: 0.5, metalness: 0.6 });
      for (let i = 0; i < 6; i++) for (const zz of [70, 120]) { const col = new THREE.Mesh(boxGeo, steel); col.position.set(12 + i * 13, 9, zz); col.scale.set(0.8, 18, 0.8); scene.add(col); }
      for (let i = 0; i < 9; i++) { const t = new THREE.Mesh(boxGeo, steel); t.position.set(8 + i * 8.5, 16.6, 95); t.scale.set(0.5, 1.2, 68); scene.add(t); }
      const sky = new THREE.MeshBasicMaterial({ color: 0x6f86c9 });
      for (let i = 0; i < 4; i++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(60, 2.2), sky); s.rotation.x = Math.PI / 2; s.position.set(41, 17.8, 68 + i * 18); scene.add(s); }
      const fixture = new THREE.MeshBasicMaterial({ color: 0xfff1d6 });
      for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) {
        const f = new THREE.Mesh(boxGeo, fixture); f.position.set(12 + i * 12, 13.5, 68 + j * 18); f.scale.set(3.2, 0.25, 0.9); scene.add(f);
        if ((i + j) % 2 === 0) { const l = new THREE.PointLight(0xfff0d0, 60, 38, 2); l.position.copy(f.position).y -= 1; scene.add(l); }
      }
      const partMat = new THREE.MeshStandardMaterial({ color: 0xc7c2b8, roughness: 0.6 });
      const machineMat = new THREE.MeshStandardMaterial({ color: 0x3a4540, roughness: 0.7, metalness: 0.3 });
      const panelMat = new THREE.MeshBasicMaterial({ color: 0x5be0a8 });
      const machines = [];
      for (let r = 0; r < 3; r++) for (let i = 0; i < 6; i++) {
        const mch = new THREE.Mesh(boxGeo, machineMat); const w = rr(2.6, 4.2), h = rr(2, 3.4), d = rr(2, 3);
        mch.position.set(14 + i * 10.5 + rr(-1, 1), h / 2, 72 + r * 16 + rr(-1, 1)); mch.scale.set(w, h, d); scene.add(mch); machines.push(mch);
        const pnl = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.35), panelMat); pnl.position.set(mch.position.x - w / 2 * 0.3, h * 0.8, mch.position.z + d / 2 + 0.03); scene.add(pnl);
      }
      const belt = new THREE.Mesh(boxGeo, steel); belt.position.set(42, 0.9, 88); belt.scale.set(66, 0.5, 1.4); scene.add(belt);
      const belt2 = new THREE.Mesh(boxGeo, steel); belt2.position.set(42, 0.9, 118); belt2.scale.set(60, 0.5, 1.4); scene.add(belt2);
      const rackMat = new THREE.MeshStandardMaterial({ color: 0x8a4a2a, roughness: 0.7, metalness: 0.3 });
      for (let i = 0; i < 7; i++) { const rack = new THREE.Mesh(boxGeo, rackMat); rack.position.set(10 + i * 10, 4, 127); rack.scale.set(8, 8, 2.4); scene.add(rack); for (let s = 0; s < 3; s++) { const sh = new THREE.Mesh(boxGeo, partMat); sh.position.set(10 + i * 10 + rr(-2, 2), 1 + s * 2.6, 127); sh.scale.set(rr(1.5, 3), 1.2, 1.6); scene.add(sh); } }
      const lift = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0xe0a020, roughness: 0.6 })); lift.position.set(30, 1.1, 108); lift.scale.set(2.2, 2.2, 3.2); scene.add(lift);
      const beacon = new THREE.PointLight(0xffa000, 0, 16, 2); beacon.position.set(30, 3, 108); scene.add(beacon);
      const parts = [];
      for (let i = 0; i < 14; i++) { const p = new THREE.Mesh(boxGeo, partMat); p.scale.set(0.9, 0.5, 0.9); p.position.set(0, 1.4, 88); scene.add(p); parts.push(p); }
      // the line
      const linePts = [new THREE.Vector3(3, 0.12, 96), new THREE.Vector3(12, 0.12, 96), new THREE.Vector3(22, 0.12, 84), new THREE.Vector3(36, 0.12, 82), new THREE.Vector3(48, 0.12, 100), new THREE.Vector3(62, 0.12, 104), new THREE.Vector3(76, 0.12, 92)];
      const lineCurve = new THREE.CatmullRomCurve3(linePts, false, "centripetal", 0.6);
      const dashTex = (() => { const c = document.createElement("canvas"); c.width = 256; c.height = 8; const g = c.getContext("2d"); g.fillStyle = "#2036c9"; g.fillRect(0, 0, 256, 8); g.fillStyle = "#8fa3ff"; g.fillRect(0, 0, 96, 8); const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.repeat.set(24, 1); return t; })();
      const lineMat = new THREE.MeshBasicMaterial({ map: dashTex, color: 0xffffff });
      const line = new THREE.Mesh(new THREE.TubeGeometry(lineCurve, 240, 0.14, 8, false), lineMat); scene.add(line);
      const lineLight = new THREE.PointLight(0x4a63f0, 40, 30, 2); lineLight.position.set(40, 1.5, 92); scene.add(lineLight);
      // sparks
      const sparkGeo = new THREE.BufferGeometry(); const sparkArr = new Float32Array(90 * 3); sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkArr, 3));
      const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ map: glowTex, size: 1.1, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffb060 })); scene.add(sparks);
      const sparkLight = new THREE.PointLight(0xffa040, 0, 20, 2); sparkLight.position.set(56, 2.2, 78); scene.add(sparkLight);

      scene.add(new THREE.HemisphereLight(0x5568a0, 0x1a1712, 3.2));
      scene.add(new THREE.AmbientLight(0x2a2f3c, 1.4));
      const moon = new THREE.DirectionalLight(0xaab6e0, 2.4); moon.position.set(-200, 300, -100); scene.add(moon);

      // ---------- camera path
      const P = [[-170, 150, -270], [-95, 112, -160], [-42, 62, -66], [-11, 21, 8], [-1, 4.2, 40], [0, 2.7, 66], [0, 2.5, 90], [2.2, 2.5, 96], [10, 3.4, 96], [24, 6.5, 99], [42, 11.5, 106], [54, 14.5, 112]].map((v) => new THREE.Vector3(...v));
      const T = [[0, 0, -60], [0, 0, -10], [0, 2, 28], [0, 2, 46], [0, 2.2, 70], [0, 2.2, 92], [3, 2.4, 96], [14, 2.6, 96], [30, 3, 96], [40, 4, 94], [40, 4.5, 94], [40, 5, 94]].map((v) => new THREE.Vector3(...v));
      const camCurve = new THREE.CatmullRomCurve3(P, false, "centripetal", 0.5);
      const tgtCurve = new THREE.CatmullRomCurve3(T, false, "centripetal", 0.5);
      const ease = (t) => t; // path already shaped

      const composer = new THREE.WebGLRenderTarget ? new EffectComposer(renderer) : null;
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.5, 0.86); composer.addPass(bloom);
      composer.addPass(new OutputPass());

      const fade = document.getElementById("fade"), flash = document.getElementById("flash");
      const clamp01 = (v) => Math.max(0, Math.min(1, v));

      window.renderFrame = (time) => {
        const u = clamp01(time / DURATION);
        const pos = camCurve.getPoint(ease(u)), tgt = tgtCurve.getPoint(ease(u));
        camera.position.copy(pos); camera.lookAt(tgt);
        camera.fov = 58 + (u > 0.6 ? (u - 0.6) * 20 : 0); camera.updateProjectionMatrix();
        // subtle handheld sway
        camera.rotation.z += Math.sin(time * 0.7) * 0.004;
        dashTex.offset.x = -time * 0.35;
        parts.forEach((p, i) => { p.position.x = 10 + ((i * 4.7 + time * 3.2) % 64); });
        seed = 1000 + Math.floor(time * 30);
        const burst = Math.sin(time * 9) > 0.35 ? 1 : 0.15;
        for (let i = 0; i < 90; i++) { const a = rr(0, Math.PI * 2), r = rr(0, 2.6) * burst; sparkArr[i * 3] = 56 + Math.cos(a) * r; sparkArr[i * 3 + 1] = 2 + rr(-0.3, 1.8) * burst; sparkArr[i * 3 + 2] = 78 + Math.sin(a) * r * 0.5; }
        sparkGeo.attributes.position.needsUpdate = true; sparkLight.intensity = 25 * burst;
        beacon.intensity = Math.sin(time * 6) > 0 ? 30 : 0; lift.position.x = 30 + Math.sin(time * 0.5) * 6;
        // door flash and fades
        const doorT = 14.05;
        const fl = time < doorT ? clamp01((time - (doorT - 0.4)) / 0.4) : clamp01(1 - (time - doorT) / 0.7);
        flash.style.opacity = String(Math.pow(fl, 2) * 0.96);
        const fi = clamp01(time / 1.2), fo = clamp01((DURATION - time) / 1.2);
        fade.style.opacity = String(1 - Math.min(fi, fo));
        composer.render();
        return true;
      };
      window.ready = true;
    </script>
